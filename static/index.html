<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Data Analysis — Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --ink:#0D1F1B; --panel:#12302A; --panel-2:#183A32; --panel-3:#1E463C;
    --line: rgba(231,240,234,0.09); --line-strong: rgba(231,240,234,0.18);
    --text:#E7F0EA; --text-dim:#93B3A5; --text-faint:#5D7A6E;
    --saffron:#E0942F; --saffron-dim: rgba(224,148,47,0.16);
    --verified:#4FAE7E; --verified-dim: rgba(79,174,126,0.14);
    --flagged:#DC6A50; --flagged-dim: rgba(220,106,80,0.14);
    --pending:#6FA6C9; --pending-dim: rgba(111,166,201,0.14);
    --flood:#4FA0DC; --heatwave:#E0942F; --fog:#93B3A5;
    --font-ui:'IBM Plex Sans',system-ui,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    --risk-low:#4FAE7E; --risk-moderate:#E0942F; --risk-high:#DC6A50; --risk-critical:#E04545;
    --risk-low-dim:rgba(79,174,126,0.14); --risk-moderate-dim:rgba(224,148,47,0.14);
    --risk-high-dim:rgba(220,106,80,0.14); --risk-critical-dim:rgba(224,69,69,0.14);
  }
  *{box-sizing:border-box;} body{margin:0;background:var(--ink);color:var(--text);font-family:var(--font-ui);}
  .wrap{max-width:1040px;margin:0 auto;padding:32px 22px 70px;}
  header{margin-bottom:26px;}
  header h1{font-size:22px;margin:0 0 6px;}
  header p{margin:0;color:var(--text-dim);font-size:13.5px;max-width:640px;line-height:1.5;}
  .badge-live{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--verified);margin-bottom:10px;}
  .badge-live i{width:7px;height:7px;border-radius:50%;background:var(--verified);}
  nav{display:flex;gap:8px;margin-bottom:22px;border-bottom:1px solid var(--line);}
  nav button{background:none;border:none;color:var(--text-faint);font-family:var(--font-ui);font-size:13px;padding:10px 4px;cursor:pointer;border-bottom:2px solid transparent;margin-right:18px;}
  nav button.active{color:var(--text);border-bottom-color:var(--saffron);}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px;}
  .panel-head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .panel-head h2{font-size:13px;font-weight:600;margin:0;}
  .panel-head .meta{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);}

  #mapEl{ height:440px; width:100%; background:var(--panel-2); }
  .leaflet-popup-content-wrapper{ background:var(--panel-3); color:var(--text); border-radius:8px; }
  .leaflet-popup-content{ font-family:var(--font-ui); font-size:12.5px; margin:10px 12px; }
  .leaflet-popup-tip{ background:var(--panel-3); }
  .leaflet-container{ font-family:var(--font-ui); }

  .legend{display:flex;gap:14px;padding:12px 16px;flex-wrap:wrap;border-top:1px solid var(--line);}
  .legend span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);font-family:var(--font-mono);}
  .legend i{width:8px;height:8px;border-radius:50%;display:inline-block;}

  .city-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding:16px;}
  .city-card{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px;}
  .city-card .name{font-weight:600;font-size:13.5px;margin-bottom:4px;}
  .city-card .cond{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);margin-top:6px;}
  .city-card .loading{color:var(--text-faint);font-size:11.5px;font-family:var(--font-mono);}

  .feed-item{display:flex;gap:12px;padding:13px 16px;border-left:3px solid var(--line-strong);border-bottom:1px solid var(--line);}
  .feed-thumb{width:56px;height:56px;object-fit:cover;border-radius:6px;flex:none;background:var(--panel-2);}
  .feed-item.status-verified{border-left-color:var(--verified);}
  .feed-item.status-flagged{border-left-color:var(--flagged);}
  .feed-item.status-pending{border-left-color:var(--pending);}
  .feed-desc{margin:0 0 5px;font-size:13px;}
  .feed-meta{font-family:var(--font-mono);font-size:10.8px;color:var(--text-faint);display:flex;gap:10px;flex-wrap:wrap;}
  .status-tag{font-family:var(--font-mono);font-size:10.2px;}
  .status-tag.status-verified{color:var(--verified);} .status-tag.status-flagged{color:var(--flagged);} .status-tag.status-pending{color:var(--pending);}

  .form-panel{padding:18px;max-width:560px;}
  .field{margin-bottom:16px;} .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;background:var(--panel-2);border:1px solid var(--line-strong);border-radius:7px;padding:10px 11px;color:var(--text);font-family:var(--font-ui);font-size:13.5px;}
  .field textarea{min-height:74px;resize:vertical;}
  .file-drop{border:1px dashed var(--line-strong);border-radius:8px;padding:16px;text-align:center;color:var(--text-faint);font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .file-drop:hover{border-color:var(--saffron);color:var(--text-dim);}
  .file-drop img{max-height:100px;border-radius:6px;margin-top:6px;}
  .hidden{display:none !important;}
  .btn{border:none;border-radius:8px;padding:11px 18px;font-size:13.5px;font-weight:600;cursor:pointer;background:var(--saffron);color:#1A1005;}
  .btn:disabled{opacity:0.5;cursor:default;}
  .result{margin-top:16px;padding:14px;border-radius:8px;display:none;}
  .result.show{display:block;}
  .result.ok{background:var(--verified-dim);} .result.bad{background:var(--flagged-dim);}
  .result h3{margin:0 0 6px;font-size:13.5px;} .result p{margin:0;font-size:12.5px;color:var(--text-dim);line-height:1.5;}
  .empty{padding:24px;color:var(--text-faint);font-size:12.5px;}

  .source-list{padding:6px 0;}
  .source-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:14px 16px;border-bottom:1px solid var(--line);}
  .source-row:last-child{border-bottom:none;}
  .source-label{flex:0 0 240px;font-weight:600;font-size:12.5px;color:var(--text);}
  .source-value{flex:1;min-width:180px;font-size:12px;color:var(--text-dim);font-family:var(--font-mono);}
  .source-value a{color:var(--saffron);text-decoration:none;}
  .source-value a:hover{text-decoration:underline;}
  .source-status{flex:0 0 150px;text-align:right;}
  @media (max-width:700px){ .source-label{flex-basis:100%;} .source-status{flex-basis:100%;text-align:left;} }

  /* ── Impact Forecast Tab ───────────────────────────────────── */
  .impact-section-label{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-faint);margin:0 0 10px;padding:0 2px;}
  .national-strip{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .national-strip .ns-label{font-size:12px;color:var(--text-dim);font-family:var(--font-mono);}
  .national-strip .ns-badge{font-family:var(--font-mono);font-size:11px;font-weight:600;padding:4px 10px;border-radius:6px;}
  .city-risk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;padding:16px;}
  .city-risk-card{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;transition:transform 0.2s ease, border-color 0.2s ease;}
  .city-risk-card:hover{transform:scale(1.03);border-color:var(--line-strong);}
  .city-risk-card.selected{border-color:var(--saffron);box-shadow:0 0 0 1px var(--saffron);}
  .city-risk-card .crc-name{font-weight:600;font-size:13px;margin-bottom:6px;}
  .city-risk-card .crc-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .city-risk-card .crc-score{font-family:var(--font-mono);font-size:20px;font-weight:700;}
  .city-risk-card .crc-badge{font-family:var(--font-mono);font-size:9.5px;font-weight:600;padding:3px 8px;border-radius:5px;}
  .city-risk-card .crc-cond{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);margin-top:6px;}

  .impact-detail{animation:fadeSlideIn 0.4s ease;}
  @keyframes fadeSlideIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

  .risk-header{display:flex;align-items:center;gap:24px;padding:20px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .risk-circle{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;position:relative;}
  .risk-circle-inner{width:88px;height:88px;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .risk-circle-inner .rci-score{font-size:36px;font-weight:700;line-height:1;}
  .risk-circle-inner .rci-label{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:0.06em;margin-top:2px;}
  .risk-info{flex:1;min-width:200px;}
  .risk-info .ri-city{font-size:18px;font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:8px;}
  .risk-info .ri-badge{font-family:var(--font-mono);font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:5px;}
  .risk-info .ri-cond{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);margin-top:6px;}
  .pulse-dot{width:8px;height:8px;border-radius:50%;display:inline-block;animation:pulse 1.5s infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.5;transform:scale(1.4);}}

  .impact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;padding:16px;}
  .impact-card{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:14px;transition:transform 0.2s ease, box-shadow 0.2s ease;}
  .impact-card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,0.25);}
  .impact-card .ic-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .impact-card .ic-icon{font-size:22px;}
  .impact-card .ic-sector{font-weight:600;font-size:13.5px;flex:1;}
  .impact-card .ic-sev{font-family:var(--font-mono);font-size:9.5px;font-weight:600;padding:3px 8px;border-radius:5px;}
  .impact-card .ic-desc{font-size:12.5px;color:var(--text-dim);line-height:1.5;margin-bottom:8px;}
  .impact-card .ic-advisory{font-size:11.5px;color:var(--saffron);font-family:var(--font-mono);line-height:1.5;padding:8px 10px;background:var(--saffron-dim);border-radius:6px;}

  .infra-section{padding:16px;}
  .infra-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .infra-row .ir-label{flex:0 0 180px;font-size:12px;font-family:var(--font-mono);color:var(--text-dim);}
  .infra-row .ir-bar-wrap{flex:1;height:26px;background:var(--panel-2);border-radius:5px;overflow:hidden;position:relative;}
  .infra-row .ir-bar{height:100%;border-radius:5px;transition:width 1s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-family:var(--font-mono);font-size:10.5px;font-weight:600;color:#fff;min-width:36px;}
  .infra-row .ir-count{flex:none;font-family:var(--font-mono);font-size:12px;font-weight:600;width:40px;text-align:right;}
  @media (max-width:600px){.infra-row .ir-label{flex-basis:100%;} .infra-row{flex-wrap:wrap;}}

  .pop-strip{display:flex;align-items:center;gap:16px;padding:14px 16px;border-top:1px solid var(--line);flex-wrap:wrap;}
  .pop-strip .ps-num{font-size:28px;font-weight:700;font-family:var(--font-mono);}
  .pop-strip .ps-label{font-size:11px;color:var(--text-faint);font-family:var(--font-mono);text-transform:uppercase;}
  .pop-strip .ps-badge{font-family:var(--font-mono);font-size:10px;font-weight:600;padding:4px 10px;border-radius:5px;}

  .alert-card{display:flex;gap:12px;padding:13px 16px;border-left:3px solid var(--line-strong);border-bottom:1px solid var(--line);}
  .alert-card.alert-WARNING{border-left-color:var(--risk-moderate);}
  .alert-card.alert-CRITICAL{border-left-color:var(--risk-critical);}
  .alert-card.alert-ADVISORY{border-left-color:var(--pending);}
  .alert-card .ac-level{font-family:var(--font-mono);font-size:10px;font-weight:600;margin-bottom:4px;}
  .alert-card .ac-msg{font-size:13px;line-height:1.5;}
  .alert-card .ac-time{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);margin-top:4px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="badge-live"><i></i>LIVE — pulling real weather data from Open-Meteo</div>
    <h1>Weather Data Analysis</h1>
    <p>This runs on a real backend. Map and city conditions below are fetched live; reports you submit are checked against that live data and stored in a real database.</p>
  </header>
  <nav>
    <button data-tab="impact" class="active">Impact Forecast</button>
    <button data-tab="map">Map</button>
    <button data-tab="feed">Report feed</button>
    <button data-tab="submit">Submit report</button>
    <button data-tab="sources">Sources</button>
  </nav>
  <div id="content"></div>
</div>

<script>
// When the frontend and backend are hosted separately (Vercel + Render),
// point this at your Render backend's URL, e.g.:
//   var API_BASE = 'https://weather-data-analysis.onrender.com';
// Leave it as '' when running both locally on the same machine.
var API_BASE = 'https://weather-data-analysis.onrender.com';

var EVENT_LABELS = { flood:'Flood', storm:'Thunderstorm / heavy rain', heatwave:'Heatwave', fog:'Fog', clear:'Clear conditions' };
var CONDITION_COLOR = {
  flood: 'var(--flood)', storm: 'var(--flagged)', heatwave: 'var(--heatwave)',
  fog: 'var(--fog)', clear: 'var(--verified)'
};
var currentTab = 'impact';
var citiesCache = null;
var leafletMap = null;

function el(id){ return document.getElementById(id); }
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name.replace('var(','').replace(')','')).trim(); }
function resolveColor(v){
  // v is like 'var(--flood)' — resolve to an actual hex for Leaflet, which doesn't understand CSS vars.
  if (v.indexOf('var(') === 0) return cssVar(v);
  return v;
}

document.querySelectorAll('nav button').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('nav button').forEach(function(x){ x.classList.remove('active'); });
    b.classList.add('active');
    currentTab = b.dataset.tab;
    leafletMap = null; // force re-init if we come back to Map tab
    render();
  });
});

function render(){
  if (currentTab === 'impact') renderImpact();
  else if (currentTab === 'map') renderMapTab();
  else if (currentTab === 'feed') renderFeed();
  else if (currentTab === 'sources') renderSources();
  else renderSubmit();
}

// ---------------------------------------------------------------------------
// Impact-Based Forecasting tab — the key differentiator feature
// ---------------------------------------------------------------------------
var impactCache = null;
var selectedImpactCity = null;

function riskColor(level){
  return {LOW:'var(--risk-low)',MODERATE:'var(--risk-moderate)',HIGH:'var(--risk-high)',CRITICAL:'var(--risk-critical)'}[level]||'var(--text-faint)';
}
function riskBg(level){
  return {LOW:'var(--risk-low-dim)',MODERATE:'var(--risk-moderate-dim)',HIGH:'var(--risk-high-dim)',CRITICAL:'var(--risk-critical-dim)'}[level]||'transparent';
}
function formatPop(n){
  if(n>=1000000) return (n/1000000).toFixed(1)+'M';
  if(n>=1000) return (n/1000).toFixed(0)+'K';
  return n.toString();
}

function renderImpact(){
  el('content').innerHTML =
    '<div class="panel">' +
      '<div class="panel-head"><h2>🛡️ Impact-Based Forecast — National Overview</h2><span class="meta">live · powered by Open-Meteo</span></div>' +
      '<div id="impactNational"><div class="empty">Loading impact forecasts for all cities…</div></div>' +
    '</div>' +
    '<div id="impactDetail"></div>';

  fetch(API_BASE + '/api/impact-forecast').then(function(r){ return r.json(); }).then(function(data){
    impactCache = data;
    renderImpactOverview(data);
    // Auto-select the highest-risk city
    var highest = data.reduce(function(a,b){ return a.risk_score > b.risk_score ? a : b; }, data[0]);
    if(highest) selectImpactCity(highest.city_id);
  }).catch(function(){
    el('impactNational').innerHTML = '<div class="empty">Could not load impact data. Make sure the backend is running.</div>';
  });
}

function renderImpactOverview(data){
  // Calculate national summary
  var maxRisk = data.reduce(function(a,b){ return a.risk_score > b.risk_score ? a : b; }, data[0]);
  var avgScore = Math.round(data.reduce(function(s,c){ return s+c.risk_score; },0)/data.length);
  var highCount = data.filter(function(c){ return c.risk_level==='HIGH'||c.risk_level==='CRITICAL'; }).length;

  var natLevel = avgScore >= 70 ? 'HIGH' : avgScore >= 40 ? 'MODERATE' : 'LOW';

  var html = '<div class="national-strip">' +
    '<span class="ns-label">National Risk Level</span>' +
    '<span class="ns-badge" style="background:'+riskBg(natLevel)+';color:'+riskColor(natLevel)+'">'+natLevel+'</span>' +
    '<span class="ns-label">Avg Score: <strong>'+avgScore+'</strong>/100</span>' +
    (highCount > 0 ? '<span class="ns-label" style="color:var(--risk-high)">⚠ '+highCount+' city(s) at HIGH+ risk</span>' : '') +
  '</div>';

  html += '<div class="city-risk-grid">';
  data.forEach(function(c){
    var sel = selectedImpactCity === c.city_id ? ' selected' : '';
    html += '<div class="city-risk-card'+sel+'" onclick="selectImpactCity(\''+c.city_id+'\')">' +
      '<div class="crc-name">'+c.city_name+'</div>' +
      '<div class="crc-row">' +
        '<span class="crc-score" style="color:'+riskColor(c.risk_level)+'">'+c.risk_score+'</span>' +
        '<span class="crc-badge" style="background:'+riskBg(c.risk_level)+';color:'+riskColor(c.risk_level)+'">'+c.risk_level+'</span>' +
      '</div>' +
      '<div class="crc-cond">'+c.weather.condition_label+' · '+(c.weather.temperature_c!=null?c.weather.temperature_c+'°C':'—')+'</div>' +
    '</div>';
  });
  html += '</div>';

  el('impactNational').innerHTML = html;
}

function selectImpactCity(cityId){
  selectedImpactCity = cityId;
  // Update selected card styling
  document.querySelectorAll('.city-risk-card').forEach(function(card){
    card.classList.remove('selected');
  });
  var cards = document.querySelectorAll('.city-risk-card');
  if(impactCache){
    impactCache.forEach(function(c, i){
      if(c.city_id === cityId && cards[i]) cards[i].classList.add('selected');
    });
  }

  // Fetch detailed impact for this city
  fetch(API_BASE + '/api/impact-forecast/' + cityId).then(function(r){ return r.json(); }).then(function(data){
    renderImpactDetail(data);
  }).catch(function(){
    el('impactDetail').innerHTML = '<div class="panel"><div class="empty">Could not load impact details.</div></div>';
  });
}

function renderImpactDetail(d){
  var pulseDot = (d.risk_level==='HIGH'||d.risk_level==='CRITICAL') ?
    '<span class="pulse-dot" style="background:'+riskColor(d.risk_level)+'"></span>' : '';

  var html = '<div class="panel impact-detail" style="margin-top:18px;">';

  // ── Risk Header with animated circle
  html += '<div class="risk-header">' +
    '<div class="risk-circle" style="background:conic-gradient('+riskColor(d.risk_level)+' '+d.risk_score+'%, var(--panel-2) 0)">' +
      '<div class="risk-circle-inner">' +
        '<span class="rci-score" style="color:'+riskColor(d.risk_level)+'">'+d.risk_score+'</span>' +
        '<span class="rci-label">RISK</span>' +
      '</div>' +
    '</div>' +
    '<div class="risk-info">' +
      '<div class="ri-city">'+d.city_name+' '+pulseDot+'</div>' +
      '<span class="ri-badge" style="background:'+riskBg(d.risk_level)+';color:'+riskColor(d.risk_level)+'">'+d.risk_level+' RISK</span>' +
      '<div class="ri-cond">'+d.weather.condition_label+' · '+(d.weather.temperature_c!=null?d.weather.temperature_c+'°C':'—')+
        (d.weather.precipitation_mm!=null?' · '+d.weather.precipitation_mm+'mm/hr':'')+'</div>' +
    '</div>' +
  '</div>';

  // ── Impact Sectors
  if(d.impacts && d.impacts.length){
    html += '<div style="padding:16px 16px 0;"><div class="impact-section-label">Sector Impacts</div></div>';
    html += '<div class="impact-grid">';
    d.impacts.forEach(function(imp){
      html += '<div class="impact-card">' +
        '<div class="ic-top">' +
          '<span class="ic-icon">'+imp.icon+'</span>' +
          '<span class="ic-sector">'+imp.sector+'</span>' +
          '<span class="ic-sev" style="background:'+riskBg(imp.severity)+';color:'+riskColor(imp.severity)+'">'+imp.severity+'</span>' +
        '</div>' +
        '<div class="ic-desc">'+imp.description+'</div>' +
        '<div class="ic-advisory">⚡ '+imp.advisory+'</div>' +
      '</div>';
    });
    html += '</div>';
  }

  // ── Infrastructure at Risk (bar chart)
  if(d.vulnerable_infrastructure && d.vulnerable_infrastructure.length){
    var maxCount = d.vulnerable_infrastructure.reduce(function(m,v){ return Math.max(m,v.count_at_risk); },1);
    html += '<div class="infra-section">' +
      '<div class="impact-section-label">Infrastructure at Risk</div>';
    d.vulnerable_infrastructure.forEach(function(inf){
      var pct = Math.max(8, Math.round((inf.count_at_risk/maxCount)*100));
      html += '<div class="infra-row">' +
        '<span class="ir-label">'+inf.type+'</span>' +
        '<div class="ir-bar-wrap"><div class="ir-bar" style="width:'+pct+'%;background:'+riskColor(inf.risk)+'">'+inf.count_at_risk+'</div></div>' +
      '</div>';
    });
    html += '</div>';
  }

  // ── Population Impact
  if(d.population_affected){
    var pop = d.population_affected;
    html += '<div class="pop-strip">' +
      '<div><div class="ps-num" style="color:'+riskColor(d.risk_level)+'">'+formatPop(pop.estimated)+'</div>' +
      '<div class="ps-label">Estimated population affected</div></div>';
    if(pop.evacuation_recommended){
      html += '<span class="ps-badge" style="background:var(--risk-critical-dim);color:var(--risk-critical)">🚨 EVACUATION RECOMMENDED</span>';
    }
    if(pop.shelter_advisory){
      html += '<span class="ps-badge" style="background:var(--risk-high-dim);color:var(--risk-high)">🏠 SHELTER ADVISORY</span>';
    }
    if(!pop.evacuation_recommended && !pop.shelter_advisory){
      html += '<span class="ps-badge" style="background:var(--risk-low-dim);color:var(--risk-low)">✓ No special advisory</span>';
    }
    html += '</div>';
  }

  // ── Active Alerts
  if(d.alerts && d.alerts.length){
    html += '<div style="padding:16px 16px 0;"><div class="impact-section-label">Active Alerts</div></div>';
    d.alerts.forEach(function(a){
      var lvlColor = {WARNING:'var(--risk-moderate)',CRITICAL:'var(--risk-critical)',ADVISORY:'var(--pending)'}[a.level]||'var(--text-faint)';
      var when = new Date(a.issued_at * 1000).toLocaleString('en-IN');
      var until = new Date(a.valid_until * 1000).toLocaleString('en-IN');
      html += '<div class="alert-card alert-'+a.level+'">' +
        '<div style="flex:1;">' +
          '<div class="ac-level" style="color:'+lvlColor+'">● '+a.level+'</div>' +
          '<div class="ac-msg">'+a.message+'</div>' +
          '<div class="ac-time">Issued: '+when+' · Valid until: '+until+'</div>' +
        '</div>' +
      '</div>';
    });
  }

  html += '</div>'; // close panel
  el('impactDetail').innerHTML = html;

  // Animate the bar chart widths (start from 0)
  setTimeout(function(){
    document.querySelectorAll('.ir-bar').forEach(function(bar){
      var w = bar.style.width;
      bar.style.width = '0%';
      setTimeout(function(){ bar.style.width = w; }, 50);
    });
  }, 50);
}

function renderMapTab(){
  el('content').innerHTML =
    '<div class="panel">' +
      '<div class="panel-head"><h2>Live map — India</h2><span class="meta">OpenStreetMap · click a marker</span></div>' +
      '<div id="mapEl"></div>' +
      '<div class="legend">' +
        '<span><i style="background:'+resolveColor(CONDITION_COLOR.flood)+'"></i>Flood</span>' +
        '<span><i style="background:'+resolveColor(CONDITION_COLOR.storm)+'"></i>Storm</span>' +
        '<span><i style="background:'+resolveColor(CONDITION_COLOR.heatwave)+'"></i>Heatwave</span>' +
        '<span><i style="background:'+resolveColor(CONDITION_COLOR.fog)+'"></i>Fog</span>' +
        '<span><i style="background:'+resolveColor(CONDITION_COLOR.clear)+'"></i>Clear</span>' +
      '</div>' +
    '</div>' +
    '<div class="panel"><div class="panel-head"><h2>Tracked cities</h2></div>' +
    '<div class="city-grid" id="cityGrid"><div class="empty">Loading live weather data…</div></div></div>';

  fetch(API_BASE + '/api/cities').then(function(r){ return r.json(); }).then(function(cities){
    citiesCache = cities;
    initMap(cities);

    var grid = el('cityGrid');
    grid.innerHTML = cities.map(function(c){
      return '<div class="city-card" id="card-'+c.id+'"><div class="name">'+c.name+'</div><div class="loading">fetching…</div></div>';
    }).join('');

    cities.forEach(function(c){
      fetch(API_BASE + '/api/ground-truth/' + c.id).then(function(r){ return r.json(); }).then(function(g){
        var card = el('card-' + c.id);
        if (card){
          card.innerHTML =
            '<div class="name">' + c.name + '</div>' +
            '<div class="cond">' + g.condition_label + '</div>' +
            '<div class="cond">' + (g.temperature_c != null ? g.temperature_c + '°C' : '—') +
            (g.precipitation_mm != null ? ' · ' + g.precipitation_mm + 'mm/hr' : '') + '</div>';
        }
        colorMarker(c.id, g);
      }).catch(function(){
        var card = el('card-' + c.id);
        if (card) card.innerHTML = '<div class="name">' + c.name + '</div><div class="loading">unavailable</div>';
      });
    });
  });
}

var markersByCity = {};

function initMap(cities){
  var container = el('mapEl');
  if (!container || typeof L === 'undefined') return;

  leafletMap = L.map('mapEl', { scrollWheelZoom: false }).setView([22.9, 79.5], 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 12,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(leafletMap);

  markersByCity = {};
  cities.forEach(function(c){
    var m = L.circleMarker([c.lat, c.lon], {
      radius: 9, weight: 2, color: resolveColor('var(--text-faint)'),
      fillColor: resolveColor('var(--text-faint)'), fillOpacity: 0.85
    }).addTo(leafletMap);
    m.bindPopup('<b>' + c.name + '</b><br>Loading live data…');
    markersByCity[c.id] = m;
  });
}

function colorMarker(cityId, ground){
  var m = markersByCity[cityId];
  if (!m) return;
  var color = resolveColor(CONDITION_COLOR[ground.condition] || 'var(--text-faint)');
  m.setStyle({ color: color, fillColor: color });
  var tempStr = ground.temperature_c != null ? ground.temperature_c + '°C' : '—';
  var precipStr = ground.precipitation_mm != null ? ' · ' + ground.precipitation_mm + 'mm/hr' : '';
  m.setPopupContent('<b>' + cityNameById(cityId) + '</b><br>' + ground.condition_label + '<br>' + tempStr + precipStr);
}

function cityNameById(id){
  if (!citiesCache) return id;
  for (var i=0;i<citiesCache.length;i++){ if (citiesCache[i].id === id) return citiesCache[i].name; }
  return id;
}

function renderFeed(){
  el('content').innerHTML =
    '<div class="panel"><div class="panel-head"><h2>Report feed</h2></div><div id="feedList"><div class="empty">Loading…</div></div></div>';
  fetch(API_BASE + '/api/reports').then(function(r){ return r.json(); }).then(function(reports){
    var list = el('feedList');
    if (!reports.length){ list.innerHTML = '<div class="empty">No reports yet — submit one from the Submit tab.</div>'; return; }
    list.innerHTML = reports.map(function(r){
      var when = new Date(r.created_at * 1000).toLocaleString('en-IN');
      var statusText;
      if (r.status === 'verified') statusText = 'Verified';
      else if (r.status === 'pending') statusText = 'Pending';
      else if (r.flag_reason === 'duplicate_image') statusText = 'Flagged — duplicate image';
      else statusText = 'Flagged — no matching ground data';

      var thumbHtml = r.photo_path
        ? '<img class="feed-thumb" src="' + API_BASE + r.photo_path + '" alt="submitted photo">'
        : '';

      return '<div class="feed-item status-' + r.status + '">' +
        thumbHtml +
        '<div style="flex:1;">' +
        '<span class="status-tag status-' + r.status + '">' + statusText + '</span>' +
        '<p class="feed-desc">' + r.description + '</p>' +
        '<div class="feed-meta"><span>' + r.source + '</span><span>' + r.city_id + '</span><span>' + when + '</span></div>' +
        '</div></div>';
    }).join('');
  });
}

var SOURCES = [
  ['Live deployed prototype', 'weather-data-analysis-steel.vercel.app', null],
  ['Source code (GitHub)', 'github.com/mugesh3112007-sudo/weather-data-analysis', 'https://github.com/mugesh3112007-sudo/weather-data-analysis'],
  ['Alert format standard', 'OASIS Common Alerting Protocol (CAP) — docs.oasis-open.org/emergency/cap', 'https://docs.oasis-open.org/emergency/cap']
];

function renderSources(){
  el('content').innerHTML =
    '<div class="panel"><div class="panel-head"><h2>Data sources &amp; credits</h2><span class="meta">transparency</span></div>' +
    '<div class="source-list" id="sourceList"><div class="empty">Loading…</div></div></div>';

  fetch(API_BASE + '/api/source-status').then(function(r){ return r.json(); }).then(function(data){
    var liveRows = data.sources.map(function(s){
      var valueHtml = '<a href="' + s.url + '" target="_blank" rel="noopener">' + s.detail + '</a>';
      var statusHtml = s.active
        ? '<span class="status-tag status-verified"><i></i>Active</span>'
        : '<span class="status-tag status-flagged"><i></i>Not yet configured</span>';
      return '<div class="source-row">' +
        '<div class="source-label">' + s.name + '</div>' +
        '<div class="source-value">' + valueHtml + '</div>' +
        '<div class="source-status">' + statusHtml + '</div>' +
      '</div>';
    }).join('');

    var staticRows = SOURCES.map(function(s){
      var valueHtml = s[2] ? '<a href="' + s[2] + '" target="_blank" rel="noopener">' + s[1] + '</a>' : s[1];
      return '<div class="source-row">' +
        '<div class="source-label">' + s[0] + '</div>' +
        '<div class="source-value">' + valueHtml + '</div>' +
        '<div class="source-status"></div>' +
      '</div>';
    }).join('');

    el('sourceList').innerHTML = liveRows + staticRows;
  }).catch(function(){
    var staticRows = SOURCES.map(function(s){
      var valueHtml = s[2] ? '<a href="' + s[2] + '" target="_blank" rel="noopener">' + s[1] + '</a>' : s[1];
      return '<div class="source-row"><div class="source-label">' + s[0] + '</div><div class="source-value">' + valueHtml + '</div></div>';
    }).join('');
    el('sourceList').innerHTML = staticRows;
  });
}

function renderSubmit(){
  var cities = citiesCache || [];
  function draw(){
    var opts = cities.map(function(c){ return '<option value="' + c.id + '">' + c.name + '</option>'; }).join('');
    var typeOpts = Object.keys(EVENT_LABELS).map(function(k){ return '<option value="' + k + '">' + EVENT_LABELS[k] + '</option>'; }).join('');
    el('content').innerHTML =
      '<div class="panel"><div class="form-panel">' +
      '<form id="reportForm">' +
      '<div class="field"><label>City</label><select id="fCity">' + opts + '</select></div>' +
      '<div class="field"><label>Event type</label><select id="fType">' + typeOpts + '</select></div>' +
      '<div class="field"><label>Description</label><textarea id="fDesc" placeholder="What are you seeing right now?"></textarea></div>' +
      '<div class="field"><label>Photo (optional — checked for recycled/duplicate images)</label>' +
        '<div class="file-drop" id="fileDrop"><span id="fileDropLabel">Click to attach a photo</span><input type="file" id="fPhoto" accept="image/*" class="hidden"><img id="filePreview" class="hidden"></div>' +
      '</div>' +
      '<button type="submit" class="btn" id="submitBtn">Submit &amp; verify against live data</button>' +
      '</form><div class="result" id="result"></div>' +
      '</div></div>';

    var fileDrop = el('fileDrop');
    var fPhoto = el('fPhoto');
    var filePreview = el('filePreview');
    var fileDropLabel = el('fileDropLabel');
    fileDrop.addEventListener('click', function(){ fPhoto.click(); });
    fPhoto.addEventListener('change', function(){
      if (fPhoto.files && fPhoto.files[0]){
        try{
          var url = URL.createObjectURL(fPhoto.files[0]);
          filePreview.src = url;
          filePreview.classList.remove('hidden');
          fileDropLabel.textContent = fPhoto.files[0].name;
        }catch(err){}
      }
    });

    el('reportForm').addEventListener('submit', function(e){
      e.preventDefault();
      var btn = el('submitBtn');
      btn.disabled = true; btn.textContent = 'Checking live weather data…';

      var eventType = el('fType').value;
      var formData = new FormData();
      formData.append('city_id', el('fCity').value);
      formData.append('type', eventType);
      formData.append('description', el('fDesc').value || 'No description provided.');
      if (fPhoto.files && fPhoto.files[0]) {
        formData.append('photo', fPhoto.files[0]);
      }

      fetch(API_BASE + '/api/reports', { method: 'POST', body: formData })
      .then(function(r){ return r.json(); })
      .then(function(data){
        var res = el('result');
        if (data.duplicate_of) {
          res.className = 'result show bad';
          res.innerHTML = '<h3>⚠ Flagged — duplicate image detected</h3>' +
            '<p>This photo\'s visual fingerprint matches report #' + data.duplicate_of +
            ' already in the system — it looks like a recycled or reposted image rather than new evidence.</p>';
        } else if (data.matches) {
          res.className = 'result show ok';
          res.innerHTML = '<h3>✓ Verified against live data</h3><p>Live conditions for this city show ' +
            data.ground_truth.condition_label + ', matching your report.</p>';
        } else {
          res.className = 'result show bad';
          res.innerHTML = '<h3>⚠ Flagged — no match</h3><p>You reported ' + EVENT_LABELS[eventType] +
            ', but live conditions show ' + data.ground_truth.condition_label + '. This report is flagged for review.</p>';
        }
        btn.disabled = false; btn.textContent = 'Submit & verify against live data';
        el('reportForm').reset();
        filePreview.classList.add('hidden');
        fileDropLabel.textContent = 'Click to attach a photo';
      }).catch(function(){
        btn.disabled = false; btn.textContent = 'Submit & verify against live data';
        alert('Something went wrong reaching the server.');
      });
    });
  }
  if (cities.length) draw();
  else fetch(API_BASE + '/api/cities').then(function(r){ return r.json(); }).then(function(c){ citiesCache = c; cities = c; draw(); });
}

render();
</script>
